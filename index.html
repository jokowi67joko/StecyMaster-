<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StecyMaster Forum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <header>
        <div class="menu-icon">☰</div>
        <div class="logo"><span class="text-orange">Stecy</span>Master</div>
        
        <!-- Area Login / Profil -->
        <div id="userArea" style="display: flex; gap: 10px; align-items: center;">
            <button id="btnOpenLogin" class="btn-orange" onclick="bukaLoginModal()" style="padding: 6px 14px; font-size: 13px; border-radius: 20px;">Login</button>
            <img id="userProfilePic" src="" alt="Profile" style="width: 32px; height: 32px; border-radius: 50%; display: none; cursor: pointer;" onclick="logout()">
        </div>
    </header>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Cari mod, texture, map...">
    </div>

    <!-- Kategori -->
    <div class="tabs">
        <button class="tab active" onclick="filterKategori('Semua')">Semua</button>
        <button class="tab" onclick="filterKategori('Mod')">Mod</button>
        <button class="tab" onclick="filterKategori('Texture')">Texture</button>
        <button class="tab" onclick="filterKategori('Map')">Map</button>
    </div>

    <!-- Feed Item -->
    <div class="container" id="feedContainer">
        <p style="text-align: center; color: #888; padding: 20px;">Memuat data...</p>
    </div>

    <!-- Tombol Plus (Sembunyi sebelum login) -->
    <div id="floatingBtn" onclick="bukaModal()">+</div>

    <!-- Modal Form Upload Item -->
    <div id="modalUpload" class="modal">
        <div class="modal-box">
            <h3 style="margin-bottom:10px;">Kirim Item Baru</h3>
            <input type="text" id="judulItem" placeholder="Judul Mod/Texture">
            <select id="kategoriItem">
                <option value="Mod">Mod</option>
                <option value="Texture">Texture</option>
                <option value="Map">Map</option>
            </select>
            <input type="text" id="versiMcpe" placeholder="Versi MCPE (ex: 0.15.10)">
            <textarea id="deskripsiItem" rows="3" placeholder="Deskripsi singkat..."></textarea>
            <input type="url" id="urlGambar" placeholder="URL Gambar Thumbnail">
            <input type="url" id="urlFile" placeholder="URL File Download">
            <div class="modal-actions">
                <button class="btn-orange" onclick="kirimItem()">Kirim</button>
                <button class="btn-dark" onclick="tutupModal()">Batal</button>
            </div>
        </div>
    </div>

    <!-- Modal Form Login Modern -->
    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <button class="login-close" onclick="tutupLoginModal()">×</button>
            <h2 id="loginTitleText">Welcome Back<br>to StecyMaster</h2>
            <p class="login-subtitle" id="loginSubtitleText">New to StecyMaster? <span onclick="toggleLoginMode()">Sign up</span></p>

            <input type="email" id="emailInput" class="login-input" placeholder="Email address">
            <input type="password" id="passwordInput" class="login-input" placeholder="Password">

            <button class="btn-primary-login" id="btnSubmitAuth" onclick="prosesEmailAuth()">Log in</button>

            <div class="login-divider">
                <span>or sign in with</span>
            </div>

            <div class="social-login-container">
                <button class="btn-social" onclick="loginGoogle()">
                    <!-- Ikon SVG Google Asli -->
                    <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
